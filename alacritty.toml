# ~/.config/alacritty/alacritty.toml

# font download with https://www.nerdfonts.com/font-downloads
# gaide how installing for linux fonts   
# fonts
# https://www.nerdfonts.com/font-downloads
# /usr/share/fonts      переносим сюда нашу папку со шрифтами
# sudo fc-cache -f -v   – делаем обновления шрифтов

# Window settings
[window]
opacity = 0.83

[window.padding]
x = 1
y = 1

[window.class]
instance = "Alacritty"
general = "Alacritty"

# Scrolling settings
[scrolling]
history = 100000
multiplier = 3

# Font settings
[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# Color schemes
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1e222a"
foreground = "#f8f8f2"
bright_foreground = "#ffffff"

[colors.cursor]
text = "CellBackground"
cursor = "#D7F9B4"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.search.matches]
foreground = "#44475a"
background = "#50fa7b"

[colors.search.focused_match]
foreground = "#44475a"
background = "#ffb86c"

[colors.footer_bar]
background = "#282a36"
foreground = "#f8f8f2"

[colors.hints.start]
foreground = "#282a36"
background = "#f1fa8c"

[colors.hints.end]
foreground = "#f1fa8c"
background = "#282a36"

[colors.selection]
text = "CellForeground"
background = "#44475a"

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"

# Cursor settings
[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500

# Selection settings
[selection]
save_to_clipboard = true 

# Mouse bindings for Copy and Paste
[mouse]
bindings = [
  # Right-click to Paste
  { mouse = "Right", action = "Paste" },
]

# Shell configuration
[terminal.shell]
program = "/bin/fish"

# Keyboard shortcuts
[keyboard]
bindings = [
  # 1. Open new terminal instance
  { key = "Return", mods = "Alt", action = "SpawnNewInstance" },

  # 2. Use Ctrl + C to Copy text (Automatically hooks system layout)
  { key = "C", mods = "Control", mode = "~Vi", action = "Copy" },

  # 3. Use Ctrl + V to Paste text
  { key = "V", mods = "Control", mode = "~Vi", action = "Paste" },

  # 4. Use Ctrl + Shift + C to close running processes (SIGINT)
  { key = "Q", mods = "Control", chars = "\u0003" }
]


